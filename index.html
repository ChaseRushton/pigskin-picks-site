<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pigskin Picks</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --muted: #666666;
            --accent: #0A84FF;
            --card: #f5f5f7;
            --border: #e5e5e5;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1e;
                --text: #f5f5f7;
                --muted: #98989d;
                --accent: #0A84FF;
                --card: #2c2c2e;
                --border: #38383a;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            text-align: center;
            max-width: 480px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .tagline {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .links a {
            display: block;
            background: var(--card);
            color: var(--text);
            text-decoration: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 500;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        .links a:hover { opacity: 0.7; }
        .links a span {
            float: right;
            color: var(--muted);
        }
        .footer {
            margin-top: 3rem;
            color: var(--muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🏈</div>
        <h1>Pigskin Picks</h1>
        <p class="tagline">Predict NFL Games with Friends</p>

        <div class="links">
            <a href="privacy-policy.html">Privacy Policy <span>→</span></a>
            <a href="terms.html">Terms of Service <span>→</span></a>
            <a href="support.html">Support <span>→</span></a>
        </div>

        <div class="footer">
            <p>&copy; 2026 Chase Rushton</p>
        </div>
    </div>
</body>
</html>
